backend:
  name: github
  repo: your-github-username/yayalin
  branch: main

local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

site_url: https://yayalin.netlify.app
display_url: https://yayalin.netlify.app
logo_url: /favicon.svg

collections:
  - name: "blog"
    label: "部落格文章"
    icon: "edit_note"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    identifier_field: title
    summary: "{{title}} — {{category}}"
    sortable_fields: ["date", "title", "category"]
    view_groups:
      - label: "分類"
        field: category
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "日期", name: "date", widget: "datetime" }
      - label: "分類"
        name: "category"
        widget: "select"
        options: ["生活隨筆", "兒少議題", "興趣分享"]
      - { label: "摘要", name: "excerpt", widget: "text" }
      - { label: "內容", name: "body", widget: "markdown" }

  - name: "timeline"
    label: "兒少委員時間軸"
    icon: "timeline"
    folder: "src/content/timeline"
    create: true
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    identifier_field: title
    summary: "{{date}} — {{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "日期", name: "date", widget: "datetime" }
      - { label: "標題", name: "title", widget: "string" }
      - { label: "說明", name: "description", widget: "text" }

  - name: "quotes"
    label: "今日小語"
    icon: "format_quote"
    files:
      - name: "quotes"
        label: "小語清單"
        file: "src/content/quotes/quotes.json"
        fields:
          - name: "quotes"
            label: "小語"
            widget: "list"
            summary: "{{fields.text}}"
            fields:
              - { label: "編號", name: "id", widget: "string" }
              - { label: "文字", name: "text", widget: "string" }
